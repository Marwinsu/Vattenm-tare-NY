<!DOCTYPE html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Vattenförbrukning</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f3;--sf:#fff;--ink:#14232a;--mut:#5b6b72;--ac:#0f7b8a;--ln:#d5dee1;--wn:#8a5a00;--er:#b3261e;--ok:#1d7a46;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1e;--sf:#172429;--ink:#e6eef0;--mut:#9fb0b6;--ac:#4cc2d3;--ln:#2a3a40;--wn:#e0b04f;--er:#ff8a80;--ok:#6fd49b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1e;--sf:#172429;--ink:#e6eef0;--mut:#9fb0b6;--ac:#4cc2d3;--ln:#2a3a40;--wn:#e0b04f;--er:#ff8a80;--ok:#6fd49b;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:12px}.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:12px 0}
h1{font-size:1.4rem;margin:8px 0}h2{font-size:1.1rem;margin:0 0 8px}.mut{color:var(--mut);font-size:.9rem}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:flex;flex-direction:column;gap:2px;font-size:.85rem;color:var(--mut)}
input{font:inherit;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid var(--ln)}td+td{text-align:right;font-variant-numeric:tabular-nums}.t td{font-weight:700}
.note{padding:8px 10px;border-left:4px solid var(--wn);border-radius:4px;background:var(--bg);margin:8px 0}.note.er{border-color:var(--er)}.big{font-size:1.15rem;font-weight:700}
button{font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;border:1px solid var(--ac);background:var(--ac);color:var(--sf);cursor:pointer}button.s{background:none;color:var(--ac);padding:3px 8px;font-size:.85rem}
.ok{color:var(--ok)}.er{color:var(--er)}textarea{width:100%;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:8px}
</style></head><body><main>
<h1>Vattenförbrukning</h1>
<div class="card"><h2>1. Mätarställningar (m³)</h2><div class="g">
<label>Huvudmätare, start<input id="m1" inputmode="decimal"></label><label>Huvudmätare, slut<input id="m2" inputmode="decimal"></label>
<label>Grannens mätare, start<input id="g1" inputmode="decimal"></label><label>Grannens mätare, slut<input id="g2" inputmode="decimal"></label></div></div>
<div class="card"><h2>2. Fakturor (€)</h2><div class="g">
<label>Faktura 1<input id="f1" inputmode="decimal"></label><label>Faktura 2<input id="f2" inputmode="decimal"></label>
<label>Faktura 3<input id="f3" inputmode="decimal"></label><label>Utjämningsfaktura (minus om kredit)<input id="ut" inputmode="decimal"></label></div></div>
<div class="card" id="res"></div>
<div class="card"><h2>Spara räkning</h2><div class="g"><label>Namn, t.ex. 2025–2026<input id="nm"></label><div style="align-self:end"><button onclick="sv()">Spara</button></div></div><div id="lst"></div></div>
<details class="card"><summary>Säkerhetskopia</summary><p class="mut">Datan finns bara i den här webbläsaren. Kopiera texten och spara den någonstans, eller klistra in en gammal kopia för att återställa.</p><textarea id="bk" rows="4"></textarea><p><button class="s" onclick="ex()">Visa kopia</button> <button class="s" onclick="im()">Återställ från text</button></p></details>
<p class="mut" id="tst"></p></main>
<script>
const $=id=>document.getElementById(id),K='vatten_enkel';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=Array.isArray(S)?S:[];
const put=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const M=['m1','m2','g1','g2'],C=['f1','f2','f3','ut'],ALL=[...M,...C];
function sc(s,d){s=String(s).trim().replace(/\s/g,'').replace(',','.');if(s==='')return null;const m=s.match(/^(-?)(\d*)(?:\.(\d*))?$/);if(!m||(!m[2]&&!m[3]))return NaN;let f=m[3]||'';f=f.slice(0,d).padEnd(d,'0');return((m[1]?-1:1)*parseInt((m[2]||'0')+f,10))||0}
const rnd=(n,d)=>{const s=(n<0)!==(d<0)?-1:1;n=Math.abs(n);d=Math.abs(d);return s*Math.floor((2*n+d)/(2*d))};
const eur=c=>(c/100).toLocaleString('sv-FI',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const m3=v=>(v/1000).toLocaleString('sv-FI',{minimumFractionDigits:3,maximumFractionDigits:3})+' m³';
const pc=x=>(x*100).toLocaleString('sv-FI',{minimumFractionDigits:2,maximumFractionDigits:2})+' %';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function core(v){
 if(M.some(k=>v[k]==null))return{e:'Fyll i alla fyra mätarställningarna.',w:1};
 const tot=v.m2-v.m1,nb=v.g2-v.g1,we=tot-nb;
 if(tot<0||nb<0)return{e:'En slutställning är lägre än startställningen. Om en mätare har bytts: räkna ut förbrukningen själv ((gamla slutställningen − start) + nya slutställningen), skriv 0 som start och summan som slut.'};
 if(nb>tot)return{e:'Grannens förbrukning är större än fastighetens totala. Kontrollera mätarställningarna.'};
 if(tot===0)return{e:'Total förbrukning är noll, så utjämningen kan inte fördelas efter förbrukning. Fördela den manuellt.'};
 const r={tot,nb,we,pw:we/tot,pn:nb/tot};
 if(['f1','f2','f3','ut'].some(k=>v[k]==null))return{...r,e:'Fyll i alla fyra fakturorna för att se kostnaderna.',w:1};
 const e=v.f1+v.f2+v.f3,wE=rnd(v.f1,2)+rnd(v.f2,2)+rnd(v.f3,2),nE=e-wE,wU=rnd(v.ut*we,tot),nU=v.ut-wU;
 return{...r,wE,nE,wU,nU,wT:wE+wU,nT:nE+nU,net:e+v.ut}}
function vals(){const v={};for(const k of ALL)v[k]=sc($(k).value,M.includes(k)?3:2);return v}
function upd(){const v=vals(),bad=ALL.filter(k=>Number.isNaN(v[k]));
 if(bad.length)return $('res').innerHTML='<div class="note er">Något fält innehåller något annat än ett tal.</div>';
 const r=core(v);let h='<h2>Resultat</h2>';
 if(r.tot!=null)h+=`<table><tr><td>Fastighetens förbrukning<td>${m3(r.tot)}<tr><td>Grannens förbrukning<td>${m3(r.nb)} (${pc(r.pn)})<tr><td>Vår förbrukning (total − granne)<td>${m3(r.we)} (${pc(r.pw)})</table>`;
 if(r.e)return $('res').innerHTML=h+`<div class="note ${r.w?'':'er'}">${r.e}</div>`;
 const kr=v.ut<0,vb=kr?'får tillbaka':'betalar';h+=`<div class="note" style="border-color:var(--ac)"><b>Utjämningsfakturan ${eur(v.ut)}</b> delas efter förbrukning:<br>Jag ${vb} <b>${eur(Math.abs(r.wU))}</b> (${pc(r.pw)})<br>Grannen ${vb} <b>${eur(Math.abs(r.nU))}</b> (${pc(r.pn)})</div><table style="margin-top:12px"><tr><td><td><b>Jag</b><td><b>Grannen</b><tr><td>Faktura 1-3 (hälften var)<td>${eur(r.wE)}<td>${eur(r.nE)}<tr><td>Utjämning${kr?' (kredit)':''}<td>${eur(r.wU)}<td>${eur(r.nU)}<tr class="t"><td>Slutlig kostnad<td>${eur(r.wT)}<td>${eur(r.nT)}</table>`;
 h+=`<p class="${r.wT+r.nT===r.net?'ok':'er'}">Kontroll: ${eur(r.wT)} + ${eur(r.nT)} = ${eur(r.wT+r.nT)}${r.wT+r.nT===r.net?' = summa av fakturorna ✓':' ≠ '+eur(r.net)+' ✗'}</p><p class="mut">Min andel avrundas till närmaste cent, grannen får resten så att summan stämmer.</p>`;
 $('res').innerHTML=h}
function lst(){$('lst').innerHTML=S.length?`<table>${S.map((s,i)=>{const pv={};for(const k of ALL){const x=sc(s.v[k]||'',M.includes(k)?3:2);pv[k]=Number.isNaN(x)?null:x}const r=core(pv);return`<tr><td>${esc(s.n)}<br><span class="mut">${r.wT!=null?'Jag '+eur(r.wT)+' · Granne '+eur(r.nT):'ofullständig'}</span><td><button class="s" onclick="ld(${i})">Öppna</button> <button class="s" onclick="rm(${i})">Ta bort</button>`}).join('')}</table>`:'<p class="mut">Inga sparade avräkningar än.</p>'}
function sv(){const n=$('nm').value.trim();if(!n)return $('nm').focus();const v={};for(const k of ALL)v[k]=$(k).value;const i=S.findIndex(s=>s.n===n);i<0?S.unshift({n,v}):S[i]={n,v};put();lst()}
function ld(i){for(const k of ALL)$(k).value=S[i].v[k]||'';$('nm').value=S[i].n;upd()}
function rm(i){S.splice(i,1);put();lst()}
function ex(){$('bk').value=JSON.stringify(S)}
function im(){try{const d=JSON.parse($('bk').value);if(!Array.isArray(d))throw 0;S=d;put();lst()}catch(e){$('bk').value='Ogiltig text.'}}
function test(){const A=core({m1:0,m2:180000,g1:0,g2:65000,f1:30000,f2:30000,f3:30000,ut:30000}),B=core({m1:0,m2:180000,g1:0,g2:65000,f1:30000,f2:30000,f3:30000,ut:-30000});
 return A.wT===64167&&A.nT===55833&&A.wT+A.nT===120000&&B.wT===25833&&B.nT===34167&&B.wT+B.nT===60000}
for(const k of ALL)$(k).oninput=upd;
$('tst').textContent='Beräkningstest (exempel A och B): '+(test()?'godkänt ✓':'FEL ✗');upd();lst();
</script></body></html>
